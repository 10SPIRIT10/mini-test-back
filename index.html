<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Complet - Enregistrement et Liste</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f4f9; display: flex; flex-direction: column; align-items: center; }
        .card { width: 100%; max-width: 450px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; box-sizing: border-box; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        #message { margin-top: 15px; font-weight: bold; text-align: center; }
        ul { list-style: none; padding: 0; margin-top: 10px; }
        li { background: #f9f9f9; margin-top: 8px; padding: 10px; border-radius: 4px; border-left: 4px solid #28a745; display: flex; justify-content: space-between; align-items: center; }
        .info span { font-weight: bold; color: #333; }
        .info small { display: block; color: #777; font-size: 0.8em; margin-top: 2px; }
    </style>
</head>
<body>

    <!-- Formulaire d'envoi -->
    <div class="card">
        <h2>Formulaire d'Enregistrement</h2>
        <form id="testForm">
            <label for="nom">Nom :</label>
            <input type="text" id="nom" required placeholder="Ex: Jean Dupont">

            <label for="telephone">Téléphone :</label>
            <input type="tel" id="telephone" required placeholder="Ex: 690000000">

            <button type="submit">Envoyer</button>
        </form>
        <div id="message"></div>
    </div>

    <!-- Liste des enregistrements -->
    <div class="card">
        <h3>📋 Liste des Enregistrements</h3>
        <div id="listeRecords">Chargement des données...</div>
    </div>

    <script>
        // Ton URL Railway en ligne
        const API_URL = 'https://mini-test-back-production.up.railway.app';

        // Fonction pour charger et afficher les enregistrements
        async function chargerRecords() {
            const listeDiv = document.getElementById('listeRecords');
            try {
                const response = await fetch(`${API_URL}/api/records`);
                const result = await response.json();

                if (result.success) {
                    if (result.data.length === 0) {
                        listeDiv.innerHTML = '<p style="color: #666; text-align: center;">Aucun enregistrement pour le moment.</p>';
                        return;
                    }

                    let html = '<ul>';
                    result.data.forEach(item => {
                        // Formater proprement la date
                        const dateFormatee = new Date(item.created_at).toLocaleString('fr-FR');
                        html += `
                            <li class="info">
                                <div>
                                    <span>${item.nom}</span> - ${item.telephone}
                                    <small>${dateFormatee}</small>
                                </div>
                            </li>
                        `;
                    });
                    html += '</ul>';
                    listeDiv.innerHTML = html;
                } else {
                    listeDiv.innerHTML = '<p style="color: red; text-align: center;">Erreur lors du chargement de la liste.</p>';
                }
            } catch (error) {
                console.error("Erreur réseau :", error);
                listeDiv.innerHTML = '<p style="color: red; text-align: center;">Impossible de contacter le serveur.</p>';
            }
        }

        // Charger la liste dès l'ouverture de la page
        chargerRecords();

        // Gestion de l'envoi du formulaire
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('message');
            messageDiv.style.color = "blue";
            messageDiv.innerText = "Envoi en cours...";

            const formData = {
                nom: document.getElementById('nom').value.trim(),
                telephone: document.getElementById('telephone').value.trim()
            };

            try {
                const response = await fetch(`${API_URL}/api/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    messageDiv.style.color = "green";
                    messageDiv.innerText = "✅ " + data.message;
                    document.getElementById('testForm').reset();
                    
                    // Actualiser la liste instantanément après un ajout réussi !
                    chargerRecords();
                } else {
                    messageDiv.style.color = "red";
                    messageDiv.innerText = "❌ " + (data.message || "Erreur inconnue");
                }
            } catch (error) {
                console.error("Erreur réseau :", error);
                messageDiv.style.color = "red";
                messageDiv.innerText = "❌ Impossible de contacter le serveur.";
            }
        });
    </script>
</body>
</html>
